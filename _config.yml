# GitHub Pages: i contenuti multimediali sono distribuiti da Cloudflare R2.
# Evita di inserirli nell'artefatto Pages (limite massimo 1 GB).
# Gli originali restano nel repository e nel bucket R2.
exclude:
  - "*.jpg"
  - "**/*.jpg"
  - "*.jpeg"
  - "**/*.jpeg"
  - "*.png"
  - "**/*.png"
  - "*.gif"
  - "**/*.gif"
  - "*.avif"
  - "**/*.avif"
  - "*.mp4"
  - "**/*.mp4"
  - "*.mov"
  - "**/*.mov"
  - "*.webm"
  - "**/*.webm"
  - "*.MOV"
  - "**/*.MOV"
  - "*.MP4"
  - "**/*.MP4"
  - "*.JPG"
  - "**/*.JPG"
  - "*.JPEG"
  - "**/*.JPEG"
  - "*.PNG"
  - "**/*.PNG"
