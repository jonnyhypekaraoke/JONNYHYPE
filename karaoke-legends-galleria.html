<script id="jh-sponsor-carousel-script">
(()=>{const rail=document.getElementById('jh-sponsor-carousel');const box=document.getElementById('jh-sponsor-lightbox');if(!rail||!box)return;const full=box.querySelector('img');const close=box.querySelector('button');let timer=null;let paused=false;let resumeAt=0;const stop=()=>{if(timer){clearInterval(timer);timer=null}};const start=()=>{stop();if(paused||matchMedia('(prefers-reduced-motion: reduce)').matches)return;timer=setInterval(()=>{if(box.hidden&&rail.scrollWidth>rail.clientWidth+4){const max=rail.scrollWidth-rail.clientWidth;if(rail.scrollLeft>=max-3)rail.scrollTo({left:0,behavior:'smooth'});else rail.scrollBy({left:Math.max(1,rail.clientWidth*.72),behavior:'smooth'});}},2600)};rail.addEventListener('mouseenter',()=>{paused=true;stop()});rail.addEventListener('mouseleave',()=>{paused=false;start()});rail.addEventListener('touchstart',()=>{paused=true;stop()},{passive:true});rail.addEventListener('touchend',()=>{clearTimeout(resumeAt);resumeAt=setTimeout(()=>{paused=false;start()},2200)},{passive:true});rail.querySelectorAll('[data-sponsor-full]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();paused=true;stop();full.src=a.href;full.alt=a.querySelector('img')?.alt||'Logo sponsor ingrandito';box.hidden=false;close.focus()}));const hide=()=>{box.hidden=true;full.src='';paused=false;start()};close.addEventListener('click',hide);box.addEventListener('click',e=>{if(e.target===box)hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!box.hidden)hide()});start()})();
</script>
