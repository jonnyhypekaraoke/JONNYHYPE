<script id="jh-sponsor-carousel-script">
(()=>{const rail=document.getElementById('jh-sponsor-carousel');const box=document.getElementById('jh-sponsor-lightbox');if(!rail||!box||rail.dataset.ready)return;rail.dataset.ready='1';const full=box.querySelector('img');const close=box.querySelector('button');const originals=[...rail.querySelectorAll(':scope > a[data-sponsor-full]')];const track=document.createElement('div');track.className='jh-sponsor-track';originals.forEach(a=>track.appendChild(a));originals.forEach(a=>{const clone=a.cloneNode(true);clone.removeAttribute('data-sponsor-full');clone.setAttribute('aria-hidden','true');clone.querySelector('img')?.setAttribute('alt','');track.appendChild(clone)});rail.replaceChildren(track);const pause=()=>track.classList.add('is-paused');const resume=()=>track.classList.remove('is-paused');rail.addEventListener('mouseenter',pause);rail.addEventListener('mouseleave',resume);rail.addEventListener('touchstart',pause,{passive:true});rail.addEventListener('touchend',()=>setTimeout(resume,1200),{passive:true});track.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();pause();full.src=a.href;full.alt=a.querySelector('img')?.alt||'Logo sponsor ingrandito';box.hidden=false;close.focus()}));const hide=()=>{box.hidden=true;full.src='';resume()};close.addEventListener('click',hide);box.addEventListener('click',e=>{if(e.target===box)hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!box.hidden)hide()})})();
</script>
