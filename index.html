<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="description" content="JONNYHYPE — DJ SET • KARAOKE">
<title>JONNYHYPE — DJ SET • KARAOKE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#050507;color:#fff;font-family:Arial,Helvetica,sans-serif}
.hero{min-height:100svh;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.photo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.02) 42%,rgba(5,5,7,.45) 72%,#050507 100%),url("jonnyhype-portrait.jpg") center top/cover no-repeat}
.content{position:relative;z-index:2;width:min(640px,88vw);margin:0 auto;padding:0 0 4.5vh;text-align:center}
.logo{display:block;width:min(360px,76vw);height:auto;margin:0 auto 15px;filter:drop-shadow(0 5px 16px rgba(0,0,0,.75))}
.tag{margin:0 0 18px;font-size:13px;font-weight:700;letter-spacing:.28em;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.links{display:grid;gap:11px}.btn{min-height:55px;display:flex;align-items:center;justify-content:center;border-radius:17px;text-decoration:none;font-size:14px;font-weight:800;letter-spacing:.18em}
.spotify{color:#111;background:linear-gradient(135deg,#fff0c8,#d8b36a)}.social{color:#fff;background:rgba(5,5,7,.70);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px)}
.festival{padding:68px 7vw 54px;text-align:center;background:#07070a;border-top:1px solid rgba(255,255,255,.08)}
.festival-logo{display:block;width:min(330px,78vw);height:auto;margin:0 auto 28px;filter:drop-shadow(0 8px 22px rgba(0,0,0,.55))}
.festival-title{font-size:13px;letter-spacing:.24em;font-weight:800;margin:0 0 18px}
.festival-info{font-size:16px;line-height:1.75;color:#d5d5d5;margin:0 auto 24px}.festival-info strong{color:#fff}
.festival-btn{display:inline-flex;min-height:50px;padding:0 28px;align-items:center;justify-content:center;border-radius:15px;text-decoration:none;background:linear-gradient(135deg,#fff0c8,#d8b36a);color:#111;font-size:13px;font-weight:800;letter-spacing:.16em}
.partners{padding:55px 6vw 65px;text-align:center;background:#050507}.partners h2{margin:0 0 30px;font-size:13px;letter-spacing:.28em;font-weight:800;color:#ddd}
.partner-grid{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}
.partner{min-height:125px;border:1px solid rgba(255,255,255,.10);border-radius:18px;background:rgba(255,255,255,.025);display:flex;align-items:center;justify-content:center;padding:16px}
.partner img{max-width:100%;max-height:92px;width:auto;height:auto;display:block}.partner.radio img{max-height:82px}.partner.tele img{max-height:72px}
footer{padding:30px 20px;text-align:center;color:#777;font-size:11px;letter-spacing:.16em;background:#050507}
@media(max-width:600px){.content{width:88vw;padding-bottom:3.2vh}.logo{width:70vw;margin-bottom:13px}.tag{font-size:11px;letter-spacing:.24em;margin-bottom:15px}.btn{min-height:53px;border-radius:16px}.festival{padding-top:58px}.festival-logo{width:76vw;margin-bottom:24px}.partner-grid{gap:12px}.partner{min-height:112px;padding:12px}}
</style>
</head>
<body>
<section class="hero"><div class="photo"></div><div class="content">
<img class="logo" src="jonnyhype-logo.png" alt="JONNYHYPE">
<div class="tag">DJ SET • KARAOKE</div>
<div class="links">
<a class="btn spotify" href="https://open.spotify.com/artist/084BcwC4P7NKvnPsv7lIJW" target="_blank" rel="noopener">SPOTIFY</a>
<a class="btn social" href="https://www.instagram.com/jonnyhype.official/" target="_blank" rel="noopener">INSTAGRAM</a>
<a class="btn social" href="https://youtube.com/@jonnyhype.official" target="_blank" rel="noopener">YOUTUBE</a>
</div></div></section>
<section class="festival">
<img class="festival-logo" src="ravenna-song-festival-2026.png" alt="Ravenna Song Festival 2026">
<div class="festival-title">RAVENNA SONG FESTIVAL</div>
<p class="festival-info"><strong>Seconda Edizione · 2026</strong><br>Piazza Andrea Costa 6<br><strong>MERCATO COPERTO — RAVENNA</strong><br><br>Tutti i martedì di settembre<br>Finale · 29 settembre 2026</p>
<a class="festival-btn" href="https://www.instagram.com/ravennasongfestival/" target="_blank" rel="noopener noreferrer">SCOPRI IL FESTIVAL</a>
</section>
<section class="partners"><h2>MEDIA PARTNER</h2><div class="partner-grid">
<div class="partner radio"><img src="radio-studio-delta.jpeg" alt="Radio Studio Delta"></div>
<div class="partner tele"><img src="teleromagna.png" alt="TeleRomagna"></div>
</div></section>
<footer>JONNYHYPE · DJ SET · KARAOKE</footer>
</body></html>
