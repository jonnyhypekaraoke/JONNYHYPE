name: R2 media migration (safe dry run)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Lascia true per simulare senza caricare file; false per eseguire il caricamento"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  upload-media:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS CLI for Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::error::Manca uno o più GitHub Actions Secrets R2."
            exit 1
          fi
          echo "R2_ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"
          aws --version

      - name: Check media inventory
        shell: bash
        run: |
          find . -type f \( \
            -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o \
            -iname '*.webp' -o -iname '*.gif' -o -iname '*.avif' -o \
            -iname '*.mp4' -o -iname '*.mov' -o -iname '*.webm' \
          \) -not -path './.git/*' -print0 |
          python3 -c 'import sys; p=sys.stdin.buffer.read().split(b"\0"); p=[x for x in p if x]; print("File multimediali individuati:", len(p))'

      - name: Upload media to R2 (or simulate)
        env:
          R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--endpoint-url "$R2_ENDPOINT" --region auto)
          if [ "$DRY_RUN" = "true" ]; then
            echo "MODALITÀ SIMULAZIONE: nessun file verrà caricato."
            args+=(--dryrun)
          else
            echo "CARICAMENTO REALE: i file saranno copiati in R2 senza cancellare gli originali."
          fi
          aws s3 sync . s3://jonnyhype-media \
            --exclude "*" \
            --include "*.[jJ][pP][gG]" \
            --include "*.[jJ][pP][eE][gG]" \
            --include "*.[pP][nN][gG]" \
            --include "*.[wW][eE][bB][pP]" \
            --include "*.[gG][iI][fF]" \
            --include "*.[aA][vV][iI][fF]" \
            --include "*.[mM][pP]4" \
            --include "*.[mM][oO][vV]" \
            --include "*.[wW][eE][bB][mM]" \
            "${args[@]}"
