<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<meta name="description" content="Dettagli degli eventi JONNYHYPE: programma, orari, prenotazioni e indicazioni.">
<title>Evento · JONNYHYPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050507;color:#fff;font-family:Montserrat,Arial,sans-serif}
body{padding:0 0 36px}
.top{width:min(760px,calc(100% - 32px));margin:24px auto 18px}
.wordmark{font-size:clamp(28px,7vw,38px);font-weight:900;letter-spacing:-.06em;text-decoration:none;color:#fff}
.wordmark span{color:#f02d98}
.back{display:block;margin:18px 0 0;padding:13px 16px;border:2px solid #f02d98;border-radius:14px;color:#fff;text-decoration:none;font-size:14px;font-weight:900}
.wrap{width:min(760px,calc(100% - 32px));margin:0 auto}
.event-hero{min-height:190px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #f02d98;border-radius:22px;background:radial-gradient(ellipse at 50% 45%,rgba(240,45,152,.28),transparent 58%),linear-gradient(145deg,#201622,#08080a);box-shadow:0 0 22px rgba(240,45,152,.16)}
.event-hero img{width:100%;height:clamp(220px,55vw,310px);max-height:310px;object-fit:cover;display:block}
.event-hero strong{padding:28px;text-align:center;font-size:clamp(34px,9vw,58px);font-weight:900;line-height:.98;letter-spacing:-.05em;text-transform:uppercase}
.details{padding:22px 0 0}
.date{margin:0 0 10px;color:#f02d98;font-size:clamp(24px,6vw,36px);font-weight:900;line-height:1.08;text-transform:uppercase}
.time{margin:0 0 18px;font-size:clamp(20px,5vw,28px);font-weight:900;line-height:1.2}
.kind{margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#f02d98}
.venue{margin:0 0 10px;font-size:clamp(32px,8vw,50px);font-weight:900;line-height:1;letter-spacing:-.05em;text-transform:uppercase;overflow-wrap:anywhere}
.place{margin:0 0 22px;font-size:17px;font-weight:800;line-height:1.45}
.place:before{content:"";display:inline-block;width:11px;height:11px;margin:0 9px 1px 0;border-radius:50%;background:#f02d98}
.actions{display:grid;grid-template-columns:1fr;gap:11px;margin:22px 0 30px}
.action{min-height:58px;display:flex;align-items:center;justify-content:center;padding:13px 16px;border:2px solid #f02d98;border-radius:15px;background:#f02d98;color:#080809;text-align:center;text-decoration:none;font-size:16px;font-weight:900}
.action.secondary{background:#050507;color:#fff}
.info{border-top:2px solid #f02d98;padding:18px 0 20px}
.info h2{margin:0 0 8px;color:#f02d98;font-size:16px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}
.info p{margin:0;font-size:clamp(18px,4.5vw,24px);font-weight:750;line-height:1.45;overflow-wrap:anywhere}
.info a{color:#fff;text-decoration:underline;text-decoration-color:#f02d98;text-underline-offset:4px}
.calendar{display:inline-flex;margin-top:22px;padding:12px 16px;border:1px solid #f02d98;border-radius:12px;color:#fff;text-decoration:none;font-size:13px;font-weight:800}
.status{padding:22px;border:1px solid rgba(240,45,152,.5);border-radius:16px;color:#ddd;text-align:center}
footer{width:min(760px,calc(100% - 32px));margin:35px auto 0;padding-top:20px;border-top:1px solid rgba(240,45,152,.35);color:#888;font-size:11px;letter-spacing:.08em;text-align:center}
@media(min-width:620px){.actions{grid-template-columns:1fr 1fr}.event-hero{min-height:260px}}
/* Indicatore di scorrimento minimale, coordinato con la home */
.scroll-detail-hint{
 display:flex;align-items:center;justify-content:center;
 width:100%;min-height:0;margin:0 auto;padding:4px 0 8px;
 background:transparent;border:0;text-decoration:none;
}
.scroll-detail-arrow{
 display:inline-block;color:#f02d98;font-size:25px;line-height:1;font-weight:900;
 -webkit-text-stroke:.45px rgba(255,255,255,.8);
 text-shadow:0 0 2px rgba(255,255,255,.55);
}
#event-details{scroll-margin-top:18px}
</style>

<style id="jh-event-detail-spacing-and-address-fix-20261103">
.date{margin-bottom:5px!important;line-height:1.05!important}
.time{margin:0 0 14px!important;font-size:clamp(16px,4.1vw,20px)!important;line-height:1.12!important}
.place{line-height:1.32!important;overflow-wrap:normal!important;word-break:normal!important;text-wrap:pretty}.place .address-line{display:block;white-space:nowrap;font-size:clamp(12px,3.3vw,16px);letter-spacing:-.02em}.place .city-line{display:block;margin-top:3px;color:#d6d6dc;font-size:.9em;line-height:1.2;white-space:nowrap}
.venue{overflow-wrap:normal!important;word-break:normal!important;text-wrap:balance}
.info p{overflow-wrap:normal!important;word-break:normal!important;text-wrap:pretty}
</style>
<style id="jh-igingini-info-schedule-20261103">
.info-schedule{display:grid;gap:9px;margin:0}
.info-schedule>div{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid rgba(240,45,152,.58);border-radius:10px;background:linear-gradient(100deg,rgba(240,45,152,.13),rgba(255,255,255,.035))}
.info-schedule strong{flex:0 0 82px;color:#f02d98;font-size:clamp(18px,4.8vw,23px);font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.info-schedule span{color:#fff;font-size:clamp(14px,3.8vw,18px);font-weight:900;line-height:1.2}
</style>
<style id="jh-event-detail-clean-layout-20261103">
/* Impostazione unica e compatta per tutte le schede evento */
.scroll-detail-hint{display:none!important}
.event-hero{display:flex!important;min-height:clamp(170px,48vw,250px)!important;margin:0 0 18px!important;border:1px solid rgba(240,45,152,.55)!important;border-radius:18px!important;background:#08080a!important;box-shadow:none!important}
.event-hero img{height:clamp(170px,48vw,250px)!important;max-height:250px!important;object-fit:contain!important;padding:12px!important}
.event-hero img[src*="ICE"],.event-hero img[src*="ALCHIMIA"],.event-hero img[src*="Casablanca"],.event-hero img[src*="Viavai"]{object-fit:cover!important;padding:0!important}
.details{padding:0!important}
.date{color:#F02D98!important;margin:0 0 5px!important;font-size:clamp(25px,6.2vw,35px)!important}
.time{color:#fff!important;margin:0 0 16px!important;font-size:clamp(18px,4.5vw,22px)!important;font-weight:800!important}
.kind{color:#d5d5da!important;margin:0 0 6px!important;font-size:12px!important}
.venue{margin:0 0 9px!important;font-size:clamp(34px,8vw,48px)!important;line-height:1.02!important}
.place{margin:0 0 20px!important;font-size:16px!important;line-height:1.35!important}
.place .address-line,.info .address-line{display:block!important;white-space:normal!important}
.place .city-line,.info .city-line{display:block!important;margin-top:2px!important;color:#bdbdc4!important}
.info{border-top:1px solid rgba(255,255,255,.22)!important;padding:15px 0 16px!important}
.info h2{margin:0 0 9px!important;color:#F02D98!important;font-size:16px!important;letter-spacing:.045em!important}
.info p{font-size:17px!important;font-weight:700!important;line-height:1.4!important}
.info-schedule{display:grid!important;gap:8px!important;margin:0!important}
.info-schedule>div{display:flex!important;align-items:baseline!important;gap:16px!important;padding:3px 0!important;border:0!important;border-radius:0!important;background:none!important}
.info-schedule strong{flex:0 0 88px!important;color:#F02D98!important;font-size:18px!important;line-height:1.2!important}
.info-schedule span{color:#fff!important;font-size:17px!important;font-weight:800!important;line-height:1.25!important}
.calendar{margin-top:14px!important;border:1px solid #F02D98!important;border-radius:10px!important;padding:12px 16px!important;font-size:13px!important}
.actions{margin:18px 0 24px!important;gap:9px!important}
.action{min-height:50px!important;border-radius:10px!important;font-size:14px!important}
.action:not(.secondary){background:#F02D98!important;color:#050507!important}
@media(max-width:380px){.place{font-size:14px!important}.info-schedule strong{flex-basis:78px!important}.info-schedule span{font-size:15px!important}}
</style>
<style id="jh-detail-hero-and-special-20261103">.detail-special{color:#fff!important;font-size:clamp(16px,4vw,20px)!important;letter-spacing:.01em!important;margin:0 0 9px!important}
</style>
</head>
<body>
<header class="top">
<a class="wordmark" href="/">JONNY<span>HYPE</span></a>
<a class="back" href="/eventi.html">‹ TUTTI GLI EVENTI</a>
</header>
<main class="wrap" id="event-detail"><div class="status">Caricamento dettagli evento…</div></main>
<footer>JONNYHYPE · DJ SET · KARAOKE · EVENTS &amp; MUSIC PRODUCTION</footer>
<script>
(function(){
 const root=document.getElementById('event-detail');
 const params=new URLSearchParams(location.search);
 const wantedVenue=(params.get('venue')||'').trim().toUpperCase();
 const wantedDate=(params.get('date')||'').trim();
 const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const clean=s=>(s||'').replace(/\s+/g,' ').replace(/· APRI MAPPA/gi,'').trim();
 const months={GENNAIO:0,FEBBRAIO:1,MARZO:2,APRILE:3,MAGGIO:4,GIUGNO:5,LUGLIO:6,AGOSTO:7,SETTEMBRE:8,OTTOBRE:9,NOVEMBRE:10,DICEMBRE:11};
 function localDate(card){
  const st=card.querySelector('.date-stack');if(!st)return '';
  const p=[...st.querySelectorAll('span,strong')].map(x=>clean(x.textContent).toUpperCase());
  if(!p[1]||months[p[2]]===undefined)return '';
  const y=Number(wantedDate.slice(0,4))||new Date().getFullYear();
  return y+'-'+String(months[p[2]]+1).padStart(2,'0')+'-'+String(Number(p[1])).padStart(2,'0');
 }
 fetch('/eventi.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.text()}).then(source=>{
  const doc=new DOMParser().parseFromString(source,'text/html');
  const card=[...doc.querySelectorAll('.event-card')].find(c=>{
   const d=c.querySelector('.event-detail');if(!d)return false;
   const brand=d.querySelector('.venue-brand');
   const name=brand?clean(brand.querySelector('strong')?.textContent):clean(d.querySelector(':scope > strong:not(.event-subtitle)')?.textContent);
   return name.toUpperCase()===wantedVenue&&localDate(c)===wantedDate;
  });
  if(!card)throw new Error('Evento non trovato');
  const d=card.querySelector('.event-detail'),brand=d.querySelector('.venue-brand');
  const kind=brand?clean(brand.querySelector('span')?.textContent):'';
  const venue=brand?clean(brand.querySelector('strong')?.textContent):clean(d.querySelector(':scope > strong:not(.event-subtitle)')?.textContent);
  const subtitle=clean(d.querySelector('.event-subtitle')?.textContent);
  const time=clean(d.querySelector('.time')?.textContent);
   const placeNode=d.querySelector('.venue-link');
   const placeClone=placeNode?.cloneNode(true);placeClone?.querySelector('.map-label')?.remove();
   const placeRaw=(placeClone?.innerHTML||'').replace(/<br\s*\/?\s*>/gi,'|').replace(/<[^>]*>/g,' ').replace(/&nbsp;/gi,' ').replace(/\s+/g,' ').trim();
   const placeLines=placeRaw.split('|').map(v=>v.trim()).filter(Boolean);
   const placeBase=placeLines.length>1?placeLines[placeLines.length-1]:(placeLines[0]||'');
   const placeParts=placeBase.split('·').map(v=>v.trim()).filter(Boolean);
   let address=placeParts[0]||'';let city=placeParts.slice(1).join(' · ');
   if(wantedVenue.includes('IGINGINI')){address='VIA IX FEBBRAIO';city='RAVENNA';}
   const place=address+(city?'\\n'+city:'');
  const description=clean(d.querySelector('.event-description')?.textContent);
  const dateParts=[...card.querySelectorAll('.date-stack span,.date-stack strong')].map(x=>clean(x.textContent));
  const dateLabel=dateParts.join(' ');
  const booking=card.querySelector('.whatsapp-cta')?.getAttribute('href')||'';
  const phone=clean(card.querySelector('.wa-cta-phone')?.textContent).replace(/\D/g,'');
  const map=d.querySelector('.venue-link')?.getAttribute('href')||'';
  const calendar=card.querySelector('.event-actions .event-cta:not(.whatsapp-cta)')?.getAttribute('href')||'';
  // Usa nel dettaglio esattamente la stessa immagine associata alla scheda della home.
  const venueKey=venue.toUpperCase();
  const imageSrc=venueKey.includes('IGINGINI')?'/IGinGini%20.jpg':
    venueKey.includes('ALCHIMIA')?'/ALCHIMIA.jpg':
    venueKey.includes('ICE MARINA')?'/ICE%20.jpg':
    venueKey.includes('CASABLANCA')?'/Casablanca.jpg':
    venueKey.includes('VECCHIA NAPOLI')?'/Logo%20vecchia%20.jpg':
    venueKey.includes('VIA VAI')?'/Viavai.JPG':'';
  const image=imageSrc?'<img src="'+imageSrc+'" alt="'+esc(venue)+'">':'';
  const hero=image?'<div class="event-hero">'+image+'</div>':'<div class="event-hero"><strong>'+esc(venue)+'</strong></div>';
  const actions=[];
  if(phone)actions.push('<a class="action" href="tel:+39'+esc(phone)+'">CHIAMA E PRENOTA</a>');
  if(booking)actions.push('<a class="action secondary" href="'+esc(booking)+'" target="_blank" rel="noopener noreferrer">PRENOTA SU WHATSAPP</a>');
  if(map)actions.push('<a class="action secondary" href="'+esc(map)+'" target="_blank" rel="noopener noreferrer">COME ARRIVARE</a>');
  let sections='';
  if(description){
   const iginginiSchedule=wantedVenue.includes('IGINGINI')&&wantedDate==='2026-11-06'
    ?'<div class="info-schedule"><div><strong>20 – 23</strong><span>CENA E KARAOKE</span></div><div><strong>23 – 03</strong><span>DJ SET ’90/’00</span></div></div>'
    :'<p>'+esc(description)+'</p>';
   sections+='<section class="info"><h2>COSA C’È</h2>'+iginginiSchedule+'</section>';
  }
  /* L'orario è già mostrato sotto la data: non duplicarlo in una seconda sezione. */
  if(kind)sections+='<section class="info"><h2>TIPOLOGIA</h2><p>'+esc(kind)+'</p></section>';
  if(place)sections+='<section class="info"><h2>INDIRIZZO</h2><p><span class="address-line">'+esc(address)+'</span>'+(city?'<span class="city-line">'+esc(city)+'</span>':'')+'</p></section>';
  root.innerHTML=hero+'<div class="details" id="event-details"><h1 class="date">'+esc(dateLabel)+'</h1>'+(wantedVenue.includes('IGINGINI')&&wantedDate==='2026-11-06'?'':(function(){const t=time.replace(/^DALLE\s*/i,'').split(/[–—-]/).map(v=>v.trim()).filter(Boolean);return '<p class="time">DALLE '+esc(t[0]||'')+(t[1]?' ALLE '+esc(t[1]):'')+'</p>'})())+(subtitle.toUpperCase().includes('SPECIALE')?'<p class="kind detail-special">'+esc(subtitle)+'</p>':'')+(kind?'<p class="kind">'+esc(kind)+'</p>':'')+'<h2 class="venue">'+esc(venue)+'</h2>'+(place?'<p class="place"><span class="address-line">'+esc(address)+'</span>'+(city?'<span class="city-line">'+esc(city)+'</span>':'')+'</p>':'')+sections+(calendar?'<a class="calendar" href="'+esc(calendar)+'" download>AGGIUNGI AL CALENDARIO</a>':'')+'<div class="actions">'+actions.join('')+'</div></div>';
 }).catch(()=>{root.innerHTML='<div class="status">Non riesco a trovare questo evento. Torna all’elenco e seleziona nuovamente l’appuntamento.</div>';});
})();
</script>
</body>
</html>
