<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08080a">
<title>Il Team RSF | JONNYHYPE</title>
<meta name="description" content="Scopri i cantanti ospiti del Ravenna Song Festival nelle serate speciali JONNYHYPE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#08080a;color:#fff;font-family:Manrope,Arial,sans-serif}
.wrap{width:min(100% - 44px,810px);margin:0 auto}
.top{padding:25px 0 18px;display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #28252b}
.brand{font-family:"Space Grotesk",sans-serif;font-weight:800;letter-spacing:-.04em;text-decoration:none;color:#fff;font-size:21px}
.brand span{color:#f02d98}
.back{color:#fff;text-decoration:none;font-size:12px;font-weight:800;letter-spacing:.05em}
.back:hover{color:#f02d98}
.hero{padding:clamp(30px,6vw,52px) 0 26px}
.hero h1{font-family:"Space Grotesk",sans-serif;font-size:clamp(36px,8vw,58px);line-height:1.02;letter-spacing:-.055em;margin:0;font-weight:800}
.hero h1 span{color:#f02d98}
.hero p{max-width:650px;color:#c7c3ca;line-height:1.65;font-size:15px;margin:18px 0 0}
.artists{margin:10px 0 55px}
.artist-list{display:grid;grid-template-columns:1fr;gap:28px;max-width:760px;margin:0 auto}
.artist{min-width:0;overflow:hidden;border:1px solid #39313c;border-radius:24px;background:#050506}.artist.has-poster{border:0;border-radius:0;background:transparent;overflow:visible}.poster{display:block;width:100%;height:auto;border-radius:18px}
.artist-photo{position:relative;width:100%;aspect-ratio:.88;overflow:hidden;background:radial-gradient(ellipse at 70% 20%,rgba(240,45,152,.38),transparent 43%),radial-gradient(ellipse at 15% 80%,rgba(34,106,255,.32),transparent 50%),linear-gradient(145deg,#21152b,#09090b 72%);display:flex;align-items:stretch;justify-content:stretch}
.artist-photo:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 25%,rgba(255,255,255,.035) 25.2%,transparent 25.8%,transparent 49%,rgba(240,45,152,.09) 49.3%,transparent 50%);pointer-events:none}
.artist-photo>img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center}
.artist-info{position:absolute;inset:35% 0 0;padding:clamp(22px,5vw,42px);display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.28) 25%,rgba(0,0,0,.92) 68%,#000 100%)}
.artist-info h2{margin:0;color:#fff;font-family:"Space Grotesk",Manrope,sans-serif;font-size:clamp(34px,8vw,66px);font-weight:700;letter-spacing:-.055em;line-height:.98;text-transform:uppercase;overflow-wrap:anywhere}
.artist-info h2 .pink{color:#f02d98}
.artist-info p{margin:16px 0 0;color:#fff;font-size:12px;font-weight:800;letter-spacing:.12em;line-height:1.4;text-transform:uppercase}
.artist:nth-child(2) .artist-photo{background:radial-gradient(ellipse at 80% 20%,rgba(34,106,255,.45),transparent 45%),radial-gradient(ellipse at 20% 80%,rgba(240,45,152,.28),transparent 48%),linear-gradient(145deg,#101a36,#09090b 72%)}
.artist:nth-child(3) .artist-photo{background:radial-gradient(ellipse at 65% 20%,rgba(137,58,255,.42),transparent 43%),radial-gradient(ellipse at 12% 80%,rgba(240,45,152,.28),transparent 48%),linear-gradient(145deg,#24142f,#09090b 72%)}
.artist:nth-child(4) .artist-photo{background:radial-gradient(ellipse at 80% 18%,rgba(240,45,152,.35),transparent 43%),radial-gradient(ellipse at 18% 82%,rgba(255,116,37,.22),transparent 48%),linear-gradient(145deg,#29151e,#09090b 72%)}
.artist:nth-child(5) .artist-photo{background:radial-gradient(ellipse at 70% 20%,rgba(34,106,255,.4),transparent 43%),radial-gradient(ellipse at 18% 82%,rgba(137,58,255,.3),transparent 48%),linear-gradient(145deg,#101a36,#09090b 72%)}
.artist:nth-child(6) .artist-photo{background:radial-gradient(ellipse at 75% 18%,rgba(255,116,37,.3),transparent 43%),radial-gradient(ellipse at 18% 82%,rgba(240,45,152,.3),transparent 48%),linear-gradient(145deg,#29151e,#09090b 72%)}
.artist:nth-child(7) .artist-photo{background:radial-gradient(ellipse at 70% 20%,rgba(137,58,255,.42),transparent 43%),radial-gradient(ellipse at 15% 82%,rgba(34,106,255,.3),transparent 48%),linear-gradient(145deg,#17152e,#09090b 72%)}
.artist:nth-child(8) .artist-photo{background:radial-gradient(ellipse at 70% 20%,rgba(34,106,255,.42),transparent 43%),radial-gradient(ellipse at 15% 82%,rgba(240,45,152,.28),transparent 48%),linear-gradient(145deg,#111a30,#09090b 72%)}
.artist:nth-child(9) .artist-photo{background:radial-gradient(ellipse at 70% 20%,rgba(240,45,152,.38),transparent 43%),radial-gradient(ellipse at 15% 82%,rgba(255,116,37,.25),transparent 48%),linear-gradient(145deg,#25151e,#09090b 72%)}
.artist:nth-child(10) .artist-photo{background:radial-gradient(ellipse at 70% 20%,rgba(137,58,255,.4),transparent 43%),radial-gradient(ellipse at 15% 82%,rgba(240,45,152,.3),transparent 48%),linear-gradient(145deg,#21152b,#09090b 72%)}
.artist:not(.has-poster) .artist-photo{aspect-ratio:auto;min-height:0;padding:26px 24px;background:linear-gradient(135deg,#21152b,#09090b 72%);}.artist:not(.has-poster) .artist-info{position:static;inset:auto;padding:0;background:none}.artist:not(.has-poster) .artist-info h2{font-size:clamp(28px,6vw,44px)}.artist:not(.has-poster) .artist-info p{margin-top:9px}.foot{padding:25px 0 35px;border-top:1px solid #28252b;color:#85818a;font-size:11px;letter-spacing:.06em;text-align:center}
@media(max-width:430px){.wrap{width:calc(100% - 32px)}.hero{padding:28px 0 22px}.hero h1{font-size:clamp(38px,9vw,48px)}.artist-list{gap:20px}.artist{border-radius:20px}.artist.has-poster{border-radius:0}.poster{border-radius:14px}.artist-photo{aspect-ratio:.82}.artist-info{padding:24px 20px}.artist-info h2{font-size:clamp(32px,9vw,43px)}.artist-info p{font-size:11px;letter-spacing:.09em;margin-top:13px}}
</style>

<style id="jh-desktop-tablet-refine">
@media (min-width: 601px){
.wrap{width:min(1040px,calc(100% - 64px));margin-inline:auto}
.hero{padding:clamp(36px,4vw,60px) 0 clamp(24px,3vw,42px)}
.hero h1{font-size:clamp(42px,4.3vw,68px)!important;line-height:1.02!important}
.hero p{max-width:850px;margin-inline:auto;font-size:clamp(17px,1.4vw,22px)!important;line-height:1.55}
.artist-list{gap:clamp(24px,3vw,40px)}
.artist.has-poster{max-width:900px;margin-inline:auto}
.poster{width:100%;height:auto;display:block}
}
</style>

<style id="jh-unified-page-title">
.page-intro h1,header h1{font-family:"Space Grotesk","Manrope",Arial,sans-serif!important;font-size:clamp(42px,10.5vw,78px)!important;font-weight:900!important;line-height:.98!important;letter-spacing:-.065em!important;text-transform:uppercase!important;text-align:left!important;color:#fff!important;max-width:100%;text-wrap:balance;margin-bottom:24px!important}
.page-intro h1::after,header h1::after{content:"";display:block;width:72px;height:4px;margin-top:16px;border-radius:3px;background:#f02d98;box-shadow:0 0 12px rgba(240,45,152,.28)}
@media(max-width:480px){.page-intro h1,header h1{font-size:clamp(40px,11.8vw,60px)!important;line-height:.98!important}}
</style>
