<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>JONNYHYPE CARDS · Partner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050507;color:#fff;font-family:Montserrat,Arial,sans-serif}main{width:min(100% - 30px,520px);margin:auto;padding:30px 0 50px}.brand{text-align:center;font-size:25px;font-weight:900;letter-spacing:.1em}.brand span{color:#F02D98}.sub{text-align:center;color:#bbb;font-size:10px;letter-spacing:.2em;margin:7px 0 28px}.panel{padding:22px 18px;border:1px solid #F02D98;border-radius:18px;background:#111116}h1{font-size:19px;margin:0 0 10px}p{font-size:13px;line-height:1.5;color:#ccc}label{display:block;margin:15px 0 6px;font-size:11px;font-weight:800;letter-spacing:.1em}input{width:100%;padding:13px;border-radius:9px;border:1px solid #45414b;background:#09090d;color:#fff;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#F02D98;color:#09090d;font-weight:900;margin-top:14px;min-height:48px}button.alt{background:transparent;border:1px solid #F02D98;color:#fff}#reader{margin-top:15px;overflow:hidden;border-radius:12px}#status{min-height:25px;color:#F02D98;font-size:13px;margin-top:12px}#result{margin-top:18px;padding:20px;border-radius:14px;background:#09090d;border:1px solid #333;text-align:center}#result strong{display:block;font-size:34px;color:#F02D98;margin:8px}#result .discount{font-size:44px;font-weight:900;color:#F02D98}.hidden{display:none!important}.small{font-size:11px;color:#aaa}
</style></head><body><main>
<div class="brand">JONNY<span>HYPE</span></div><div class="sub">AREA PARTNER · VERIFICA TESSERE</div>
<section id="login" class="panel"><h1>Accesso partner</h1><p>Area riservata ai locali convenzionati. Usa l'indirizzo email associato al tuo account partner.</p><label for="email">EMAIL</label><input id="email" type="email" autocomplete="email"><button id="send">INVIA CODICE DI ACCESSO</button><div id="otpBox" class="hidden"><label for="otp">CODICE EMAIL</label><input id="otp" inputmode="numeric" maxlength="6"><button id="verify">ACCEDI</button></div><div id="loginStatus"></div></section>
<section id="scanner" class="panel hidden"><h1>Verifica tessera</h1><p>Inquadra il QR mostrato dal socio. Ogni codice è temporaneo e utilizzabile una sola volta.</p><button id="start">AVVIA FOTOCAMERA</button><div id="reader"></div><div id="result" class="hidden"></div><div id="scanStatus"></div><button id="logout" class="alt">ESCI</button></section>
</main>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import {Html5Qrcode} from "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/+esm";
const supabase=createClient("https://xceywzabnvybjeteletg.supabase.co","sb_publishable_wKQ0U1ia1FhcnWcHKgRTHQ_i_Op4Vc4");
const $=id=>document.getElementById(id);let scanner=null,busy=false;
const setStatus=t=>$("loginStatus").textContent=t;
$("send").onclick=async()=>{setStatus("");try{const {error}=await supabase.auth.signInWithOtp({email:$("email").value.trim(),options:{shouldCreateUser:false}});if(error)throw error;$("otpBox").classList.remove("hidden");setStatus("Codice inviato. Controlla la posta.");}catch(e){setStatus(e.message)}};
$("verify").onclick=async()=>{setStatus("");try{const {error}=await supabase.auth.verifyOtp({email:$("email").value.trim(),token:$("otp").value.trim(),type:"email"});if(error)throw error;await showScanner()}catch(e){setStatus(e.message)}};
async function showScanner(){const {data:{session}}=await supabase.auth.getSession();if(!session)return;$("login").classList.add("hidden");$("scanner").classList.remove("hidden")}
async function handleToken(token){
 if(busy)return;busy=true;$("scanStatus").textContent="Verifica in corso…";
 try{
  const {data,error}=await supabase.functions.invoke("cards-verify",{body:{token}});
  if(error)throw error;
  const box=$("result");box.classList.remove("hidden");
  if(data.valid){
   box.innerHTML='<div class="small">TESSERA VALIDA</div><strong>#'+String(data.card_number)+'</strong><div class="discount">'+(data.benefit_available?data.benefit_percent+"%":"—")+'</div><p>'+data.reason+'</p><p class="small">Applica lo sconto solo se previsto dalle condizioni della convenzione.</p>';
  }else{box.innerHTML='<div class="small">TESSERA NON VALIDA</div><p>'+String(data.reason||"Codice non riconosciuto")+'</p>'}
  $("scanStatus").textContent="Controllo completato. Inquadra il prossimo QR.";
 }catch(e){$("scanStatus").textContent=e.message||"Errore di verifica"}
 finally{busy=false}
}
$("start").onclick=async()=>{
 try{
  if(!scanner)scanner=new Html5Qrcode("reader");
  await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:230}},decoded=>{scanner.pause(true);handleToken(decoded).finally(()=>setTimeout(()=>{try{scanner.resume()}catch{}},1300))},()=>{});
  $("start").classList.add("hidden");
 }catch(e){$("scanStatus").textContent="Fotocamera non disponibile. Controlla i permessi del browser: "+e.message}
};
$("logout").onclick=async()=>{if(scanner){try{await scanner.stop()}catch{}}await supabase.auth.signOut();location.reload()};
supabase.auth.onAuthStateChange((_event,session)=>{if(session)showScanner()});
</script></body></html>
